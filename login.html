                <rect class="pig-leg" x="92" y="200" width="20" height="18" rx="8" />

          <!-- 消费（右）：鼠标移上去小猪想逃跑 -->

      <div class="auth-quote" id="authQuote">演示环境：账号仅保存在本地浏览器（localStorage），不会上传服务器。</div>

    <!-- 右侧表单 -->
    <main class="auth-main">
      <div class="auth-card">
        <h1 id="formTitle">欢迎回来 👋</h1>

        <div class="tabs" role="tablist">

        <div class="error-msg" id="errMsg"></div>

        <button type="button" id="guestBtn" class="btn btn-ghost btn-block" style="display:none;margin-bottom:14px;font-weight:700">
          🎯 游客免登录 · 直接体验演示

        <form id="authForm" novalidate>
          <div class="field" id="nameField" style="display:none">
            <label for="name">昵称</label>
            <input type="text" id="name" placeholder="怎么称呼你？" autocomplete="name" />
          </div>
          <div class="field">
            <label for="email">邮箱</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">密码</label>
            <input type="password" id="password" placeholder="至少 6 位" autocomplete="current-password" required />
            <div class="hint" id="pwHint">演示用，请勿使用真实重要密码。</div>
          </div>
          <div class="form-foot" id="loginFoot">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2)">
              <input type="checkbox" id="remember" style="width:auto" /> 记住我

            <a href="#" onclick="return false">忘记密码？</a>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">登录</button>
        </form>

        <p class="muted text-center" style="font-size:13px;margin-top:18px">
          登录即表示同意 <a href="#" onclick="return false">服务条款</a> 与 <a href="#" onclick="return false">隐私政策</a>
        </p>
        <p class="text-center" style="margin-top:14px">

  <script src="js/config.js"></script>
  <script src="js/api-base.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // 模式状态：login / register
    let mode = 'login';

    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const formTitle = document.getElementById('formTitle');
    const formSub = document.getElementById('formSub');
    const nameField = document.getElementById('nameField');
    const submitBtn = document.getElementById('submitBtn');
    const loginFoot = document.getElementById('loginFoot');
    const pwHint = document.getElementById('pwHint');
    const errMsg = document.getElementById('errMsg');
    const okMsg = document.getElementById('okMsg');
    const authQuote = document.getElementById('authQuote');

    // 云模式提示
    if (window.CW_CONFIG && window.CW_CONFIG.SYNC_BACKEND) {
      authQuote.textContent = '后端已接入：账号与数据由服务器数据库存储，按账号隔离；若后端未启动会自动用本地模式。';
    }

    /* 启动即探测后端：先把「连没连上」说清楚，避免提交后才看到 405 */
    const connHint = document.getElementById('connHint');
    (async () => {
      if (!(window.CW_CONFIG && window.CW_CONFIG.SYNC_BACKEND) || !window.CWApiBase) {
        connHint.textContent = '本地模式：账号仅保存在本机浏览器。';
        return;
      }
      connHint.textContent = '正在连接后端服务…';
      const b = await window.CWApiBase.resolve();
      const isLocalDev = ['localhost', '127.0.0.1', ''].indexOf(location.hostname) !== -1;
      if (b === false) {
        if (isLocalDev) {
          connHint.innerHTML = '⚠️ 未连接到后端服务（提交登录会返回 405）。<br>请先运行 <b>启动.bat</b>（或 <b>npm start</b>）再重新打开本页。';
          connHint.style.color = '#e5484d';
        } else {
          // 纯静态托管版（如 GitHub Pages）：免后端，引导游客体验 / 本地注册
          connHint.innerHTML = 'ℹ️ 当前为<b>纯静态演示版</b>：无需后端即可使用。可点下方<b>游客免登录体验</b>，或注册一个仅存本机浏览器的本地账号。';
          connHint.style.color = '#0f9d76';
          const gb = document.getElementById('guestBtn');
          if (gb) gb.style.display = 'block';
        }
      } else {
        const target = b || location.origin;
        const fromFile = location.protocol === 'file:';
        if (b && (fromFile || location.origin !== target)) {
          // 找到了后端，但当前页不是从后端同源打开的 → 引导（并可直接点开）正确入口
          const link = target + '/login.html';
          connHint.innerHTML = '✅ 后端已连接：' + target + '<br>当前页面不是从后端打开的，请使用：'
            + '<a href="' + link + '" style="font-weight:700;text-decoration:underline">' + link + '</a>';
        } else {
          connHint.textContent = '✅ 后端已连接：' + target + '　账号与账单存入服务器数据库，按账号隔离。';
        }
        connHint.style.color = '#0f9d76';
      }
    })();

    // 支持从 index.html#register 直接进入注册
    if (location.hash === '#register') setMode('register');

    function setMode(m) {
      mode = m;
      const isReg = m === 'register';
      tabLogin.classList.toggle('active', !isReg);
      tabRegister.classList.toggle('active', isReg);
      formTitle.textContent = isReg ? '创建你的账户 🚀' : '欢迎回来 👋';
      formSub.textContent = isReg ? '注册后即可使用全部智能记账功能' : '登录你的账户，继续管理财务';
      nameField.style.display = isReg ? 'block' : 'none';
      submitBtn.textContent = isReg ? '注册并进入' : '登录';
      loginFoot.style.display = isReg ? 'none' : 'flex';
      pwHint.textContent = isReg ? '至少 6 位，请勿使用真实重要密码' : '请勿使用真实重要密码';
      errMsg.textContent = ''; okMsg.textContent = '';
    }
    tabLogin.addEventListener('click', () => setMode('login'));
    tabRegister.addEventListener('click', () => setMode('register'));

    // 游客免登录进入演示（纯静态版）：清掉可能存在的本地会话，确保进入游客只读演示
    const guestBtn = document.getElementById('guestBtn');
    if (guestBtn) {
      guestBtn.addEventListener('click', () => {
        try { localStorage.removeItem('cw_session'); } catch (e) {}
        location.href = 'dashboard.html';
      });
    }

    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const submitBtnEl = document.getElementById('submitBtn');

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errMsg.textContent = ''; okMsg.textContent = '';
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!emailRe.test(email)) { errMsg.textContent = '请输入有效的邮箱地址'; return; }
      if (password.length < 6) { errMsg.textContent = '密码至少 6 位'; return; }
      if (mode === 'register' && !name) { errMsg.textContent = '请填写昵称'; return; }

      submitBtnEl.disabled = true;
      try {
        let user;
        if (mode === 'register') {
          user = await Auth.register(email, name, password);
        } else {
          user = await Auth.login(email, password);
        }
        if (user && user.offline) {
          // 后端没启动时自动回落本地模式：不阻断使用，但要让用户知情
          okMsg.textContent = '后端未连接，已用本地模式登录（数据保存在本机浏览器）';
        } else {
          okMsg.textContent = mode === 'register' ? '注册成功，正在进入…' : '登录成功，正在进入…';
        }
        // 标记「刚登录成功」，供 dashboard 弹出激励窗（仅首次，刷新不重复）
        try { sessionStorage.setItem('cw_justLoggedIn', '1'); } catch (e) {}
        setTimeout(() => { location.href = 'dashboard.html'; }, 700);
      } catch (err) {
        errMsg.textContent = err.message || '操作失败，请重试';
        submitBtnEl.disabled = false;
      }
    });

    /* —— 互动小猪：存钱→兴奋 / 消费→逃跑 —— */
    (function () {
      const pigScene = document.getElementById('pigScene');
      const pigBubble = document.getElementById('pigBubble');
      const triggerSave = document.getElementById('triggerSave');
      const triggerSpend = document.getElementById('triggerSpend');
      if (!pigScene || !triggerSave || !triggerSpend) return;

      const BUBBLE = {
        idle: '戳戳我呀 👀',
        save: '好耶！钱又安全啦 💚',
        spend: '别花！捂住钱包 🛡️'
      };
      let pigState = 'idle';

      function setPig(state) {
        if (state === pigState) return;
        pigState = state;
        pigScene.classList.remove('is-save', 'is-spend');
        if (state === 'save') pigScene.classList.add('is-save');
        if (state === 'spend') pigScene.classList.add('is-spend');
        if (pigBubble) pigBubble.textContent = BUBBLE[state];
      }

      function bindTrigger(el, state) {
        el.addEventListener('pointerenter', () => setPig(state));
        el.addEventListener('pointerleave', () => setPig('idle'));
        el.addEventListener('focus', () => setPig(state));
        el.addEventListener('blur', () => setPig('idle'));
        // 触摸 / 点击切换，避免移动端没有 hover 导致状态卡住
        el.addEventListener('click', (e) => {
          e.preventDefault();
          setPig(pigState === state ? 'idle' : state);
        });
      }

      bindTrigger(triggerSave, 'save');
      bindTrigger(triggerSpend, 'spend');

      /* 眼睛跟随鼠标：瞳孔朝光标方向偏移（闲置态生效） */
      const pigWrap = pigScene.querySelector('.pig-wrap');
      const pupilGs = pigScene.querySelectorAll('.eye-follow .pupil-g');
      const EYE_MAX = 6; // 瞳孔最大偏移（SVG 单位）
      let eyeRAF = 0, eyeTarget = { x: 0, y: 0 };

      function updateEyes() {
        eyeRAF = 0;
        pupilGs.forEach(g => g.setAttribute('transform',
          'translate(' + eyeTarget.x.toFixed(2) + ' ' + eyeTarget.y.toFixed(2) + ')'));
      }
      function onMove(e) {
        if (pigState !== 'idle') return; // 兴奋/逃跑态隐藏跟随眼，无需计算
        const r = pigWrap.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height * 0.45; // 以眼睛高度为中心
        let dx = e.clientX - cx, dy = e.clientY - cy;
        const d = Math.hypot(dx, dy) || 1;
        eyeTarget.x = (dx / d) * EYE_MAX;
        eyeTarget.y = (dy / d) * EYE_MAX;
        if (!eyeRAF) eyeRAF = requestAnimationFrame(updateEyes);
      }
      function onLeave() {
        eyeTarget.x = 0; eyeTarget.y = 0;
        if (!eyeRAF) eyeRAF = requestAnimationFrame(updateEyes);
      }
      // 指针进入/离开存钱·消费时也把眼睛归位
      function recenter() { onLeave(); }
      document.addEventListener('mousemove', onMove, { passive: true });
      document.addEventListener('mouseout', (e) => { if (!e.relatedTarget) onLeave(); });
      window.addEventListener('blur', onLeave);
      triggerSave.addEventListener('pointerenter', recenter);
      triggerSpend.addEventListener('pointerenter', recenter);
    })();
  </script>
</body>
</html>
